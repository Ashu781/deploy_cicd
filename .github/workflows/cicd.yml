name: deployment
    
on:
  push:
    branches:
      - main


permissions:
  contents: read

jobs:
  test-execution:
    runs-on: ubuntu-latest
    steps: 
      - name: checkout repo
        uses: actions/checkout@v4

      - name: test run
        run: bash greetings.sh


  docker-build:
    needs: test-execution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: ghcr login
        run: echo "${{secrets.GITHUB_TOKEN}}" | docker login ghcr.io -u "${{github.actor}}" --password-stdin

      - name: image build
        run: docker build -t ghcr.io/ashu781/greet:sha-"${GITHUB_SHA::7}" .

      - name: run container
        run: docker run --rm --name greet_cont1 ghcr.io/ashu781/greet:sha-"${GITHUB_SHA::7}"

      - name: image push
        run: docker push ghcr.io/ashu781/greet:sha-"${GITHUB_SHA::7}"  
